name: sms hl2sdk-mock tests
on:
  push:
    branches:
      - sms-1.13
  pull_request:
    branches:
      - sms-1.13
jobs:
  mock:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alliedmodders/build-containers/debian11-clang22:latest
    steps:
      - uses: actions/checkout@v7
        name: Clone sourcemod
        with:
          submodules: recursive
          path: sourcemod
          token: ${{ secrets.SUBMODULE_DEPLOY_KEY }}

      - uses: actions/checkout@v7
        name: Clone metamod-source
        with:
          repository: alliedmodders/metamod-source
          ref: 1.12-dev
          submodules: recursive
          path: metamod-source

      - uses: actions/checkout@v7
        name: Clone hl2sdk-mock
        with:
          repository: alliedmodders/hl2sdk-mock
          submodules: recursive
          path: hl2sdk-mock

      - name: Build MetaMod:Source
        working-directory: metamod-source
        run: |
          python3 configure.py --enable-optimize --sdks=mock --targets=x86,x86_64
          ambuild objdir

      - name: Build SourceMod
        working-directory: sourcemod
        run: |
          python3 configure.py --no-mysql --enable-optimize --sdks=mock --targets=x86,x86_64
          ambuild objdir

      - name: Build hl2sdk-mock
        working-directory: hl2sdk-mock
        run: |
          python3 configure.py --enable-optimize --targets=x86,x86_64
          ambuild objdir

      - name: Setup gamedir
        working-directory: hl2sdk-mock
        shell: bash
        run: |
          mkdir ../gamedir
          ./build_gamedir.sh ../gamedir ../metamod-source/objdir/package
          ./build_gamedir.sh ../gamedir ../sourcemod/objdir/package
          # The mock engine loads every VDF, without architecture filtering.
          rm ../gamedir/addons/metamod.vdf ../gamedir/addons/metamod_x64.vdf

      - name: Compile testsuite
        working-directory: hl2sdk-mock
        shell: bash
        run: |
          mkdir ../gamedir/addons/sourcemod/plugins/optional

          for f in ../sourcemod/plugins/testsuite/mock/*.sp; do
            echo "Compiling $(basename $f)"
            ../gamedir/addons/sourcemod/scripting/spcomp64 -i ../gamedir/addons/sourcemod/scripting/include -o "../gamedir/addons/sourcemod/plugins/optional/$(basename $f .sp).smx" -E "$f"
          done

      - name: Test
        working-directory: hl2sdk-mock
        shell: bash
        run: |
          for arch in x86 x86_64; do
            case "$arch" in
              x86)
                metamod_vdf=metamod.vdf
                tier0=tier0_i486.so
                vstdlib=vstdlib_i486.so
                ;;
              x86_64)
                metamod_vdf=metamod_x64.vdf
                tier0=libtier0_client.so
                vstdlib=libvstdlib_client.so
                ;;
            esac
            ln -sfn "$(realpath -e ../metamod-source/objdir/package/addons/$metamod_vdf)" ../gamedir/addons/metamod.vdf
            # Reuse the engine's libraries: loading renamed copies twice can
            # reinitialize shared globals such as the mock command line.
            ln -sfn "$tier0" "./objdir/dist/$arch/libtier0.so"
            ln -sfn "$vstdlib" "./objdir/dist/$arch/libvstdlib.so"
            # Metamod's mock dependencies use libtier0.so/libvstdlib.so.
            # The executable's RUNPATH does not cover dlopen dependencies.
            export LD_LIBRARY_PATH="$(realpath -e ./objdir/dist/$arch)"
            echo "==================================="
            echo "Testing $arch..."
            echo "==================================="
            for f in ../gamedir/addons/sourcemod/plugins/optional/*.smx; do
              echo "==================================="
              echo "Running $(basename $f)..."
              echo "==================================="
              timeout 60 ./objdir/dist/$arch/srcds -game_dir ../gamedir +map de_thunder -command "sm plugins load optional/$(basename $f)" -run -run-ticks 20 |
              {
                failed=0
                succeeded=0
                while IFS= read -r line; do
                  echo "$line"
                  if [[ "$line" == *"FAIL"* || "$line" == *"Exception reported"* ]]; then
                    failed=1
                  fi
                  if [[ "$line" == *" OK"* ]]; then
                    succeeded=1
                  fi
                done
                if [ "$failed" = "1" ] || [ "$succeeded" = "0" ]; then
                  echo "$(basename $f) failed."
                  exit 1
                fi
              }
            done
          done

      - name: Report Metamod load failures
        if: failure()
        working-directory: hl2sdk-mock
        shell: bash
        run: |
          find ../gamedir ../metamod-source/objdir/package -type f -name metamod-fatal.log -print -exec cat {} \;
